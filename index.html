<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация/вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Underdog&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06111a;
    --card: #1b2f42;
    --field: #06121b;
    --title: #f6c56e;
    --label: #ea9540;
    --hint: #4b4a47;
    --btn: #e89bab;
    --btn-text: #a8304e;
    --font: "Underdog", "Comic Sans MS", "Comic Neue", cursive, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: var(--font);
    text-transform: uppercase;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    width: min(432px, 100%);
    background: var(--card);
    padding: 34px 36px 30px;
    border-radius: 40px 40px 40px 40px / 40px 40px 40px 40px;
  }
  h1 { margin: 0 0 30px; font-weight: 400; font-size: 31px; line-height: 1.1; color: var(--title); }
  label { display: block; margin: 0 0 8px 6px; font-size: 19px; color: var(--label); }
  input {
    display: block; width: 100%; height: 32px; margin: 0 0 30px;
    background: var(--field); border: 0; border-radius: 0;
    padding: 0 10px; font: inherit; font-size: 15px; color: var(--title);
    text-transform: none;
  }
  input::placeholder { color: var(--hint); text-transform: uppercase; opacity: 1; }
  input:focus-visible { outline: 2px solid var(--label); outline-offset: 0; }
  .go {
    display: block; margin: 0 auto 14px; width: 146px; height: 30px;
    background: var(--btn); color: var(--btn-text); border: 0; border-radius: 0;
    font: inherit; font-size: 19px; cursor: pointer;
  }
  .go:hover { filter: brightness(1.06); }
  .go:disabled { opacity: .6; cursor: wait; }
  .err { margin: 0 0 12px; text-align: center; font-size: 14px; color: var(--btn); }
  .err:empty { display: none; }
  .foot { margin: 0; text-align: center; font-size: 18px; line-height: 1.1; color: var(--title); }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <h1>Регистрация/вход</h1>

    <label for="name">Имя персонажа:</label>
    <input id="name" type="text" maxlength="20" placeholder="введите любое имя..." required>

    <label for="pass">Пароль:</label>
    <input id="pass" type="password" placeholder="не от оригинального сайта, пж" required>

    <button class="go" id="go" type="submit">Войти</button>
    <p class="err" id="err" role="alert"></p>
    <p class="foot">Обязательно зовите друзей для махачей вместе!</p>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* ===================================================================
   НАСТРОЙКА: вставь сюда данные своего проекта Supabase
   (Project Settings → API). Ключ anon публичный — так и задумано.
   =================================================================== */
const SUPABASE_URL = "https://bqjdhpkcwoltvfmeobph.supabase.co";
const SUPABASE_KEY = "sb_publishable_ilo2vL7LZUo_MQU29m7tZg_UA-HEC4h";

const configured = !SUPABASE_URL.includes("ВСТАВЬ") && !SUPABASE_KEY.includes("ВСТАВЬ");

// Сессия живёт в sessionStorage: каждая вкладка = отдельный игрок
// (удобно проверять бой, открыв сайт в двух вкладках).
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true },
}) : null;

/* ===================================================================
   Store — вход и регистрация одним действием.
   Supabase требует email, поэтому из имени делаем технический адрес
   (хеш имени без учёта регистра). Настоящее имя хранится в профиле.
   =================================================================== */
const Store = {
  async _email(name) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(name.toLowerCase()));
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    return "p" + hex.slice(0, 32) + "@gmail.com";
  },

  async loginOrCreate(name, pass) {
    const email = await this._email(name);

    // 1. Пробуем войти
    let { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (!error) return { name: data.user.user_metadata.name || name, created: false };

    // 2. Не вышло — пробуем создать
    const res = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
    if (res.error) {
      const msg = (res.error.message || "").toLowerCase();
      if (res.error.code === "user_already_exists" || msg.includes("already")) {
        throw new Error("Это имя занято, а пароль не подходит.");
      }
      if (msg.includes("rate")) throw new Error("Слишком часто. Подожди минуту.");
      throw new Error("Не получилось: " + res.error.message);
    }
    if (!res.data.session) {
      throw new Error("В Supabase включено подтверждение почты — выключи его (Authentication → Providers → Email).");
    }
    return { name, created: true };
  },

  async current() {
    if (!sb) return null;
    const { data } = await sb.auth.getSession();
    const u = data.session && data.session.user;
    return u ? { name: u.user_metadata.name } : null;
  },
};

const form = document.getElementById("form");
const err = document.getElementById("err");
const go = document.getElementById("go");

function greet(name) {
  form.innerHTML = '<h1 style="margin:0">Привет, <span id="hi"></span>!</h1>';
  document.getElementById("hi").textContent = name;
  // Дальше здесь будет переход в личный кабинет.
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = "";
  if (!configured) { err.textContent = "Не заполнены ключи Supabase в начале скрипта."; return; }

  const name = document.getElementById("name").value.trim();
  const pass = document.getElementById("pass").value;
  if (name.length < 2) { err.textContent = "Имя — минимум 2 символа."; return; }
  if (pass.length < 6) { err.textContent = "Пароль — минимум 6 символов."; return; }

  go.disabled = true;
  try {
    const user = await Store.loginOrCreate(name, pass);
    greet(user.name);
  } catch (ex) {
    err.textContent = ex.message;
    go.disabled = false;
  }
});

Store.current().then(u => { if (u) greet(u.name); });
</script>
</body>
</html>
